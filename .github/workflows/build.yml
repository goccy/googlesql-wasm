name: build

# End-to-end CI for googlesql-wasm. Runs the wasmify pipeline against
# the upstream `googlesql/` submodule from a clean checkout, produces
# `googlesql.wasm` (the wasi-sdk-built artifact) and `googlesql.go`
# (protoc-gen-wasmify-go's single-file Go binding), uploads both as
# artifacts, and attaches an SLSA build-provenance attestation.
#
# Toolchain (wasi-sdk, binaryen, bazelisk, buf, wasmify CLI itself)
# lives inside the wasmify base image. On top of that, this workflow
# maintains a project-specific cache image
# (ghcr.io/<owner>/googlesql-wasm-cache) keyed on the googlesql
# submodule SHA. The cache image bakes EVERY file the cold pipeline
# generates — `.wasmify/`, the captured proto + bridge sources, the
# wasm-build outputs (including `googlesql.wasm`), and the buf-
# generated `googlesql.go` — so a run that finds a tag matching the
# current submodule SHA can skip the wasmify pipeline entirely and
# just `docker cp` the prebuilt outputs into the workspace.
#
# Cache lifecycle (kept inside this workflow — no separate scheduled
# job): each run does an opportunistic `docker pull` of
# `<image>:<submodule-sha>`. Hit -> extract `/cache/output/.` into the
# workspace and stage the release artifacts directly. Miss -> run the
# full cold pipeline, then bake a fresh image
# (`FROM ghcr.io/goccy/wasmify:edge` + `COPY output /cache/output`)
# and push as `<image>:<submodule_sha>` and `<image>:latest`. Only
# `push` events publish — `pull_request` runs may read from the cache
# but never write, so a PR cannot poison the registry with partial
# state.
#
# The image is run via `docker run` rather than the GHA `container:`
# directive: googlesql's bazel build downloads a multi-GB LLVM
# toolchain on a cache miss, and the runner only has ~14 GB free on
# `/` out of the box. We need a free-disk-space step on the host
# before the container starts, which is incompatible with a
# `container:`-scoped job (every step in such a job runs *inside*
# the container, so it cannot reach the host filesystem).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # for cache image push to ghcr
  id-token: write          # for actions/attest-build-provenance OIDC token
  attestations: write

env:
  WASMIFY_IMAGE: ghcr.io/goccy/wasmify:edge
  CACHE_IMAGE: ghcr.io/${{ github.repository_owner }}/googlesql-wasm-cache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on the runner
        # ubuntu-latest ships ~14 GB free on `/`; even with a cache
        # hit the image pull plus extracted outputs blow past that.
        # Reclaiming the preinstalled Android SDK / .NET / Haskell
        # trees gets us to ~45 GB free.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve cache image tag from googlesql submodule SHA
        id: cache_key
        run: |
          submodule_sha=$(git -C googlesql rev-parse HEAD)
          echo "submodule_sha=${submodule_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${CACHE_IMAGE}:${submodule_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Try to pull cache image
        # `docker pull` exits non-zero when the tag does not exist.
        # `continue-on-error` so that a cache miss is not a failure;
        # the next step branches on the recorded `hit` flag.
        id: cache_pull
        continue-on-error: true
        run: |
          if docker pull "${{ steps.cache_key.outputs.tag }}"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore generated files from cache image (warm path)
        # Cache hit: every file the cold pipeline produced is already
        # baked at /cache/output. `docker create` + `docker cp` is
        # cheaper than `docker run`; we never start a container, just
        # spawn a stopped one to pull files out of.
        if: steps.cache_pull.outputs.hit == 'true'
        run: |
          container=$(docker create "${{ steps.cache_key.outputs.tag }}")
          docker cp "${container}:/cache/output/." "$PWD/"
          docker rm -f "${container}"
          echo "--- restored from cache ---"
          ls -la .wasmify/wasm-build/output/ googlesql.go 2>/dev/null || true

      - name: Pull wasmify toolchain image (cold path)
        if: steps.cache_pull.outputs.hit != 'true'
        run: docker pull "$WASMIFY_IMAGE"

      - name: Run wasmify pipeline (cold path)
        # Cache miss: run the full pipeline including `wasmify build`.
        # Bazel's external + action cache lives at /root/.cache/bazel
        # inside the container; we don't bind-mount it because the
        # cache image bakes per-source build outputs, not the bazel
        # cache itself.
        if: steps.cache_pull.outputs.hit != 'true'
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e WASMIFY_NON_INTERACTIVE=1 \
            "$WASMIFY_IMAGE" \
            bash -ceuxo pipefail '
              wasmify build --non-interactive
              wasmify generate-build
              wasmify parse-headers
              wasmify gen-proto
              wasmify wasm-build --optimize --non-interactive
              buf generate
            '

      - name: Build and push cache image
        # Only on cache miss + push events. PR runs read from the
        # cache but never write, so a PR cannot poison the registry
        # with partial state.
        #
        # Bake every generated path the .gitignore advertises as
        # CI-regenerated: `.wasmify/` (build state + wasm-build
        # outputs), the captured proto + bridge sources, and the
        # final `googlesql.{wasm,go}`. The Dockerfile is materialised
        # inline in a small build context that contains only those
        # paths so the resulting layer stays focused.
        if: |
          steps.cache_pull.outputs.hit != 'true' &&
          github.event_name == 'push'
        run: |
          mkdir -p .cache-ctx/output
          for path in .wasmify build.json api-spec.json proto bridge googlesql.wasm googlesql.go; do
            if [ -e "$path" ]; then
              cp -a "$path" ".cache-ctx/output/"
            fi
          done
          echo "--- baking into cache image ---"
          ls -la .cache-ctx/output/
          cat > .cache-ctx/Dockerfile <<'EOF'
          ARG WASMIFY_TAG=edge
          FROM ghcr.io/goccy/wasmify:${WASMIFY_TAG}
          COPY output /cache/output
          WORKDIR /
          EOF
          docker build \
            -f .cache-ctx/Dockerfile \
            -t "${{ steps.cache_key.outputs.tag }}" \
            -t "${CACHE_IMAGE}:latest" \
            .cache-ctx
          docker push "${{ steps.cache_key.outputs.tag }}"
          docker push "${CACHE_IMAGE}:latest"

      - name: Stage release artifacts
        run: |
          mkdir -p release
          cp .wasmify/wasm-build/output/googlesql.wasm release/
          cp googlesql.go release/

      - uses: actions/upload-artifact@v4
        with:
          name: googlesql-${{ github.sha }}
          path: release/
          if-no-files-found: error

      - uses: actions/attest-build-provenance@v2
        # Provenance attestation only runs on `push` events and only
        # when the repo is public — the attestations API rejects
        # writes from user-owned private repos. PR runs validate the
        # pipeline but do not produce signed releases.
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        with:
          subject-path: |
            release/googlesql.wasm
            release/googlesql.go

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: googlesql-${{ github.sha }}
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          # Release assets: the wasm binary plus one bridge file per
          # supported language. Currently only Go is supported, so
          # `googlesql.go` is the sole bridge artifact. When a new
          # language plugin is added, append its bridge file here.
          files: |
            release/googlesql.wasm
            release/googlesql.go
