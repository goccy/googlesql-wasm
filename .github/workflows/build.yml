name: build

# End-to-end CI for googlesql-wasm. Runs the wasmify pipeline against
# the upstream `googlesql/` submodule from a clean checkout, produces
# `googlesql.wasm` (the wasi-sdk-built artefact) and `googlesql.go`
# (protoc-gen-wasmify-go's single-file Go binding), uploads both as
# artifacts, and attaches an SLSA build-provenance attestation.
#
# Toolchain (wasi-sdk, binaryen, bazelisk, buf, wasmify CLI itself)
# lives inside the wasmify base image, so the workflow only has to
# orchestrate inputs -> outputs. The image is run via `docker run`
# rather than the GHA `container:` directive: googlesql's bazel build
# downloads a multi-GB LLVM toolchain, and the runner only has ~14 GB
# free on `/` out of the box. We need a free-disk-space step on the
# host before the container starts, which is incompatible with a
# `container:`-scoped job (every step in such a job runs *inside* the
# container, so it cannot reach the host filesystem).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # for actions/attest-build-provenance OIDC token
  attestations: write

env:
  # Pin to a specific wasmify image SHA when bumping wasmify produces
  # breaking changes to the bridge / wasm output. `:edge` is acceptable
  # for development branches but never on tags.
  WASMIFY_IMAGE: ghcr.io/goccy/wasmify:edge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on the runner
        # ubuntu-latest ships ~14 GB free on `/`; bazel's googlesql
        # build alone pulls a ~3-4 GB LLVM toolchain, plus external
        # repositories and build outputs. Reclaiming the preinstalled
        # Android SDK / .NET / Haskell trees gets us to ~45 GB free,
        # which has comfortable headroom for the full build.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull wasmify toolchain image
        run: docker pull "$WASMIFY_IMAGE"

      - name: Cache bazel build outputs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('.gitmodules', 'googlesql/MODULE.bazel*', 'googlesql/WORKSPACE*', 'googlesql/.bazelversion') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Cache wasm intermediate objects
        uses: actions/cache@v4
        with:
          path: .wasmify/wasm-build/objects
          key: wasm-objects-${{ hashFiles('wasmify.json', '.gitmodules') }}
          restore-keys: |
            wasm-objects-

      - name: Run wasmify pipeline inside toolchain image
        # The workspace is bind-mounted into /work; bazel's external
        # repository cache is bind-mounted from a workspace-relative
        # path so actions/cache above can read/write it. Each phase
        # passes --non-interactive explicitly even though the image
        # also exports WASMIFY_NON_INTERACTIVE=1, so the workflow log
        # makes the contract obvious.
        run: |
          mkdir -p .bazel-cache
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$PWD/.bazel-cache:/root/.cache/bazel" \
            -e WASMIFY_NON_INTERACTIVE=1 \
            "$WASMIFY_IMAGE" \
            bash -ceuxo pipefail '
              wasmify build --non-interactive
              wasmify generate-build
              wasmify parse-headers
              wasmify gen-proto
              wasmify wasm-build --optimize --non-interactive
              buf generate
            '

      - name: Stage release artefacts
        run: |
          mkdir -p release
          cp .wasmify/wasm-build/output/googlesql.wasm release/
          cp googlesql.go release/

      - uses: actions/upload-artifact@v4
        with:
          name: googlesql-${{ github.sha }}
          path: release/
          if-no-files-found: error

      - uses: actions/attest-build-provenance@v2
        # Provenance attestation only on pushes to main and v* tags;
        # pull_request runs validate the pipeline but do not produce
        # signed releases.
        if: github.event_name == 'push'
        with:
          subject-path: |
            release/googlesql.wasm
            release/googlesql.go

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: googlesql-${{ github.sha }}
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          # Release assets: the wasm binary plus one bridge file per
          # supported language. Currently only Go is supported, so
          # `googlesql.go` is the sole bridge artefact. When a new
          # language plugin is added, append its bridge file here.
          files: |
            release/googlesql.wasm
            release/googlesql.go
