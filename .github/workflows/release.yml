name: Build WASM
on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Upstream source is expected to be a git submodule of this repo.
          # If you vendor it differently, replace this with an explicit clone.
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install wasmify
        run: go install github.com/goccy/wasmify/cmd/wasmify@latest

      # Cache .wasmify/ — holds wasi-sdk, build cache (.o/.a), phase state.
      # Keyed on the config files that would invalidate the cache anyway, so
      # a config change rebuilds cleanly while everyday pushes restore fully.
      # wasi-sdk pinned version (31.0) is embedded so bumping it busts the key.
      - name: Cache .wasmify
        uses: actions/cache@v4
        with:
          path: .wasmify
          key: wasmify-31.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('wasmify.json', 'bridge-config.json', 'arch.json', 'build.json', 'proto/**') }}
          restore-keys: |
            wasmify-31.0-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools and wasi-sdk
        # Reads arch.json and installs every tool listed under required_tools
        # plus wasi-sdk. No Coding Agent needed in CI. Skipped work when the
        # caches above restored a hit.
        run: make tools
      - name: Build WASM
        run: make wasm
      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'wasm/*.wasm'
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: wasm/*.wasm
